minimumLimaVersion: 2.1.0

images:
  - location: "http://ftp-archive.freebsd.org/pub/FreeBSD-Archive/old-releases/VM-IMAGES/15.1-RELEASE/amd64/Latest/FreeBSD-15.1-RELEASE-amd64-BASIC-CLOUDINIT-zfs.raw.xz"
    arch: "x86_64"
    digest: "sha256:93011721f334015ce203d43c4d204e7cddc73dc6e3e757532fe67b740dc916b4"
  - location: "http://ftp-archive.freebsd.org/pub/FreeBSD-Archive/old-releases/VM-IMAGES/15.1-RELEASE/aarch64/Latest/FreeBSD-15.1-RELEASE-arm64-aarch64-BASIC-CLOUDINIT-zfs.raw.xz"
    arch: "aarch64"
    digest: "sha256:907ca57e12503124cc48da5d698da139459c60afa023aa12e82729d655e8e15b"

os: FreeBSD
vmType: qemu

param:
  REPO: "/tmp/oddutils"

cpus: 4
memory: "4GiB"
disk: "30GiB"

containerd:
  system: false
  user: false

mounts:
  - location: "{{.Param.REPO}}"
    mountPoint: "/workspace/oddutils"
    writable: true

provision:
  - mode: system
    script: |
      #!/bin/sh
      set -eu
      pkg install -y rust scdoc just

message: |
  oddutils checkout mounted at /workspace/oddutils
  Run tests with:
    limactl shell --workdir /workspace/oddutils {{.Name}} sh -lc 'just test'
