[workspace]
members = [
    "crates/oddutils-core",
    "crates/chronic",
    "crates/combine",
    "crates/errno",
    "crates/ifdata",
    "crates/ifne",
    "crates/isutf8",
    "crates/lckdo",
    "crates/mispipe",
    "crates/parallel",
    "crates/pee",
    "crates/sponge",
    "crates/ts",
    "crates/vidir",
    "crates/vipe",
    "crates/zrun",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "GPL-2.0-only"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"
pedantic = "warn"
